# seedly-crm local stack — Next.js + self-hosted Convex (no Convex Cloud)
#
#   make -f docker.mk docker-up
#   open http://localhost:3100
#   Convex dashboard: http://localhost:6891
#
# Host ports are offset from sulus-crm (3000/3210/3211/6791) so both
# stacks can run on one machine. Container-internal ports stay 3000/3210/3211.
#
# Requires .env.docker (created by `make docker-env`).

name: seedly-crm

services:
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_TAG:-latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_PORT:-3310}:3210"
      - "${CONVEX_SITE_PORT:-3311}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-seedly-crm-dev}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?Set INSTANCE_SECRET in .env.docker — run make docker-env}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3310}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3311}
      DISABLE_BEACON: ${DISABLE_BEACON:-true}
      RUST_LOG: ${RUST_LOG:-info}
      DOCUMENT_RETENTION_DELAY: ${DOCUMENT_RETENTION_DELAY:-172800}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_BACKEND_TAG:-latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_DASHBOARD_PORT:-6891}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:3310}
    depends_on:
      convex-backend:
        condition: service_healthy

  convex-init:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_TAG:-latest}
    user: "0"
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-seedly-crm-dev}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?Set INSTANCE_SECRET in .env.docker — run make docker-env}
    volumes:
      - convex-keys:/keys
      - ./docker/convex-init-entrypoint.sh:/init.sh:ro
    depends_on:
      convex-backend:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

  convex-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    init: true
    env_file:
      - .env.docker
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      SITE_URL: ${SITE_URL:-http://localhost:3100}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://web:3000}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./convex:/app/convex
      - ./patches:/app/patches
      - ./scripts:/app/scripts
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./turbo.json:/app/turbo.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - crm_node_modules:/app/node_modules
      - convex-keys:/keys:ro
    depends_on:
      convex-backend:
        condition: service_healthy
      convex-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/convex-sync-entrypoint.sh"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    init: true
    shm_size: "1gb"
    ports:
      - "${WEB_PORT:-3100}:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://127.0.0.1:3310}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL:-http://127.0.0.1:3311}
      CONVEX_URL: http://convex-backend:3210
      CONVEX_SITE_URL: http://convex-backend:3211
      SITE_URL: ${SITE_URL:-http://localhost:3100}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./convex:/app/convex
      - ./patches:/app/patches
      - ./scripts:/app/scripts
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./turbo.json:/app/turbo.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - crm_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      convex-backend:
        condition: service_healthy
      convex-sync:
        condition: service_started
    entrypoint: ["/usr/local/bin/web-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  convex-data:
  convex-keys:
  crm_node_modules:
  web_next:
